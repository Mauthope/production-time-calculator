<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tempo de Produção - Kanban</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060a13;
            --bg-card: rgba(15, 23, 42, 0.45);
            --bg-input: rgba(10, 16, 30, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Theme Colors for Blocks */
            --color-alca: #06b6d4; /* Cyan */
            --color-alca-glow: rgba(6, 182, 212, 0.15);
            --color-alca-hover: rgba(6, 182, 212, 0.25);
            
            --color-fundo: #10b981; /* Emerald */
            --color-fundo-glow: rgba(16, 185, 129, 0.15);
            --color-fundo-hover: rgba(16, 185, 129, 0.25);
            
            --color-topo: #8b5cf6; /* Violet */
            --color-topo-glow: rgba(139, 92, 246, 0.15);
            --color-topo-hover: rgba(139, 92, 246, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 5% 5%, rgba(6, 182, 212, 0.12) 0px, transparent 40%),
                radial-gradient(at 95% 95%, rgba(139, 92, 246, 0.12) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem 8rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4 10%, #10b981 50%, #8b5cf6 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Action Menu Bar */
        .actions-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            animation: fadeIn 0.9s ease-out;
        }

        .btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border: none;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.35);
        }

        /* Kanban Board Grid */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (max-width: 1024px) {
            .board {
                grid-template-columns: 1fr;
                gap: 2rem;
            }
        }

        /* Kanban Column / Block */
        .column {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 500px;
            transition: var(--transition);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Specific border highlights based on theme */
        .column-alca {
            border-top: 4px solid var(--color-alca);
        }
        .column-fundo {
            border-top: 4px solid var(--color-fundo);
        }
        .column-topo {
            border-top: 4px solid var(--color-topo);
        }

        .column:hover {
            box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Column Header */
        .column-header {
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .column-title {
            font-size: 1.35rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .column-alca .column-title { color: var(--color-alca); }
        .column-fundo .column-title { color: var(--color-fundo); }
        .column-topo .column-title { color: var(--color-topo); }

        .item-count {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 500;
        }

        /* Items Container */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        /* Checkbox Option Card */
        .option-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: transparent;
            transition: var(--transition);
        }

        .option-card:hover {
            transform: translateX(2px);
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Hidden Input Checkbox */
        .option-input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        /* Styled checkbox label content */
        .option-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-grow: 1;
        }

        /* Custom Checkbox Indicator */
        .custom-checkbox {
            width: 1.15rem;
            height: 1.15rem;
            border: 1.5px solid var(--text-muted);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            background: transparent;
        }

        .custom-checkbox svg {
            width: 0.7rem;
            height: 0.7rem;
            fill: none;
            stroke: #fff;
            stroke-width: 3px;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: scale(0);
            transition: transform 0.15s cubic-bezier(0.12, 0.4, 0.29, 1.46);
        }

        .option-name {
            font-size: 0.925rem;
            font-weight: 500;
            color: #e2e8f0;
            transition: var(--transition);
        }

        /* Value Badge */
        .option-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
            flex-shrink: 0;
            font-family: monospace;
        }

        /* Color Active States per Block type */
        /* ALÇA ACTIVE STATE */
        .column-alca .option-input:checked + .option-card {
            background: var(--color-alca-glow);
            border-color: rgba(6, 182, 212, 0.35);
        }
        .column-alca .option-input:checked + .option-card::before {
            background: var(--color-alca);
        }
        .column-alca .option-input:checked + .option-card .custom-checkbox {
            background: var(--color-alca);
            border-color: var(--color-alca);
        }
        .column-alca .option-input:checked + .option-card .custom-checkbox svg {
            transform: scale(1);
        }
        .column-alca .option-input:checked + .option-card .option-name {
            color: #ffffff;
            font-weight: 600;
        }
        .column-alca .option-input:checked + .option-card .option-badge {
            background: rgba(6, 182, 212, 0.2);
            color: var(--color-alca);
            border-color: rgba(6, 182, 212, 0.1);
        }

        /* FUNDO ACTIVE STATE */
        .column-fundo .option-input:checked + .option-card {
            background: var(--color-fundo-glow);
            border-color: rgba(16, 185, 129, 0.35);
        }
        .column-fundo .option-input:checked + .option-card::before {
            background: var(--color-fundo);
        }
        .column-fundo .option-input:checked + .option-card .custom-checkbox {
            background: var(--color-fundo);
            border-color: var(--color-fundo);
        }
        .column-fundo .option-input:checked + .option-card .custom-checkbox svg {
            transform: scale(1);
        }
        .column-fundo .option-input:checked + .option-card .option-name {
            color: #ffffff;
            font-weight: 600;
        }
        .column-fundo .option-input:checked + .option-card .option-badge {
            background: rgba(16, 185, 129, 0.2);
            color: var(--color-fundo);
            border-color: rgba(16, 185, 129, 0.1);
        }

        /* TOPO ACTIVE STATE */
        .column-topo .option-input:checked + .option-card {
            background: var(--color-topo-glow);
            border-color: rgba(139, 92, 246, 0.35);
        }
        .column-topo .option-input:checked + .option-card::before {
            background: var(--color-topo);
        }
        .column-topo .option-input:checked + .option-card .custom-checkbox {
            background: var(--color-topo);
            border-color: var(--color-topo);
        }
        .column-topo .option-input:checked + .option-card .custom-checkbox svg {
            transform: scale(1);
        }
        .column-topo .option-input:checked + .option-card .option-name {
            color: #ffffff;
            font-weight: 600;
        }
        .column-topo .option-input:checked + .option-card .option-badge {
            background: rgba(139, 92, 246, 0.2);
            color: var(--color-topo);
            border-color: rgba(139, 92, 246, 0.1);
        }

        /* Column Totalizer Card (At bottom) */
        .totalizer-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            transition: var(--transition);
        }

        .totalizer-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .totalizer-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            transition: color 0.3s;
        }

        .column-alca .totalizer-card { border-color: rgba(6, 182, 212, 0.2); }
        .column-alca .totalizer-value { color: var(--color-alca); }
        
        .column-fundo .totalizer-card { border-color: rgba(16, 185, 129, 0.2); }
        .column-fundo .totalizer-value { color: var(--color-fundo); }
        
        .column-topo .totalizer-card { border-color: rgba(139, 92, 246, 0.2); }
        .column-topo .totalizer-value { color: var(--color-topo); }

        /* Floating Summary Footer Panel */
        .summary-panel {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 900px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.1);
            z-index: 100;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: var(--transition);
        }

        @media (max-width: 640px) {
            .summary-panel {
                flex-direction: column;
                gap: 1.25rem;
                padding: 1.25rem;
                text-align: center;
                bottom: 1rem;
            }
        }

        .summary-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .summary-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary-total {
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .summary-total-readable {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .summary-actions {
            display: flex;
            gap: 0.75rem;
        }

        @media (max-width: 640px) {
            .summary-actions {
                width: 100%;
                justify-content: center;
            }
            .summary-actions .btn {
                flex-grow: 1;
                justify-content: center;
            }
        }

        /* Toast notifications styling */
        .toast {
            position: fixed;
            top: 2rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        
        @keyframes slideUpNormal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulse highlight for changes */
        .pulse-change {
            animation: pulseGlow 0.4s ease-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Tempo de Produção - Big Bags</h1>
        <p>Painel Kanban de personalização e cálculo dinâmico de tempo de costura</p>
    </header>

    <div class="actions-bar">
        <button class="btn" id="btn-restore-defaults" title="Apenas Operações Padrão marcadas">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8m0 0H15m6 0V2M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16m0 0h6m-6 0v6"/></svg>
            Operação Padrão
        </button>
        <button class="btn" id="btn-select-all">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Marcar Todos
        </button>
        <button class="btn" id="btn-clear-all">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg>
            Limpar Todos
        </button>
    </div>

    <main class="board">
        <!-- ALÇA COLUMN -->
        <section class="column column-alca" id="col-alca">
            <div class="column-header">
                <h2 class="column-title">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    Alça
                </h2>
                <span class="item-count" id="count-alca">0/16</span>
            </div>
            <div class="items-list" id="list-alca">
                <!-- Checkboxes will be populated by JS -->
            </div>
            <div class="totalizer-card">
                <span class="totalizer-label">Totalizador</span>
                <span class="totalizer-value" id="total-alca">0,00 min</span>
            </div>
        </section>

        <!-- FUNDO COLUMN -->
        <section class="column column-fundo" id="col-fundo">
            <div class="column-header">
                <h2 class="column-title">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="21" x2="21" y2="21"/></svg>
                    Fundo
                </h2>
                <span class="item-count" id="count-fundo">0/14</span>
            </div>
            <div class="items-list" id="list-fundo">
                <!-- Checkboxes will be populated by JS -->
            </div>
            <div class="totalizer-card">
                <span class="totalizer-label">Totalizador</span>
                <span class="totalizer-value" id="total-fundo">0,00 min</span>
            </div>
        </section>

        <!-- TOPO COLUMN -->
        <section class="column column-topo" id="col-topo">
            <div class="column-header">
                <h2 class="column-title">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 14.2 0L21 21Z"/></svg>
                    Topo
                </h2>
                <span class="item-count" id="count-topo">0/16</span>
            </div>
            <div class="items-list" id="list-topo">
                <!-- Checkboxes will be populated by JS -->
            </div>
            <div class="totalizer-card">
                <span class="totalizer-label">Totalizador</span>
                <span class="totalizer-value" id="total-topo">0,00 min</span>
            </div>
        </section>
    </main>

    <!-- FLOATING SUMMARY DASHBOARD -->
    <div class="summary-panel">
        <div class="summary-info">
            <span class="summary-label">Tempo Total de Costura</span>
            <div style="display: flex; flex-direction: column;">
                <span class="summary-total" id="grand-total">0,00 <span style="font-size: 1.25rem; font-weight: 600; margin-left: 0.1rem;">min</span></span>
                <span class="summary-total-readable" id="grand-total-readable">0 min 0 s</span>
            </div>
        </div>
        <div class="summary-actions">
            <button class="btn btn-primary" id="btn-copy">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copiar Resumo
            </button>
        </div>
    </div>

    <!-- Toast Banner -->
    <div class="toast" id="toast-notify">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toast-message">Copiado para a área de transferência!</span>
    </div>

    <!-- Script Data & Logic -->
    <script>
        // Options Data Definition
        const data = {
            alca: [
                { id: "alca-op-padrao", name: "Alça (Operação Padrão)", time: 2.50, isDefault: true },
                { id: "alca-sem-pers", name: "Sem personalização", time: 0.00, isDefault: false },
                { id: "alca-laminado", name: "Laminado", time: 0.50, isDefault: false },
                { id: "alca-patch-lam", name: "Patch+ Lam", time: 0.50, isDefault: false },
                { id: "alca-externo", name: "Externo", time: 0.50, isDefault: false },
                { id: "alca-feltro", name: "Feltro", time: 1.00, isDefault: false },
                { id: "alca-de-30-40", name: "De 30 a 40", time: 1.00, isDefault: false },
                { id: "alca-maior-40", name: "Maior que 40", time: 1.00, isDefault: false },
                { id: "alca-pe-galinha", name: "Pé Galinha", time: 0.50, isDefault: false },
                { id: "alca-dupla", name: "Alça Dupla", time: 0.00, isDefault: false },
                { id: "alca-estiva", name: "Estiva", time: 2.50, isDefault: false },
                { id: "alca-canto-70", name: "Canto até 70", time: 0.50, isDefault: false },
                { id: "alca-canto-maior-70", name: "Canto maior 70", time: 1.00, isDefault: false },
                { id: "alca-travado-30", name: "Travado até 30", time: 0.00, isDefault: false },
                { id: "alca-altura-17", name: "Altura maior que 1,7m", time: 0.50, isDefault: false },
                { id: "alca-altura-07", name: "Altura menor que 0,7m", time: 0.50, isDefault: false }
            ],
            fundo: [
                { id: "fundo-op-padrao", name: "Fundo (Operação padrão)", time: 1.75, isDefault: true },
                { id: "fundo-sem-pers", name: "Sem personalização", time: 0.00, isDefault: false },
                { id: "fundo-laminado", name: "Laminado", time: 0.35, isDefault: false },
                { id: "fundo-dobra-dupla", name: "Dobra dupla", time: 0.00, isDefault: false },
                { id: "fundo-forrado", name: "Forrado", time: 0.25, isDefault: false },
                { id: "fundo-feltro", name: "Feltro", time: 1.75, isDefault: false },
                { id: "fundo-1-vedante", name: "1 Vedante", time: 1.00, isDefault: false },
                { id: "fundo-2-vedante", name: "2 Vedante", time: 1.50, isDefault: false },
                { id: "fundo-ate-100", name: "Até 1,00m", time: 0.00, isDefault: false },
                { id: "fundo-maior-100", name: "Maior que 1,00m", time: 0.25, isDefault: false },
                { id: "fundo-4-paineis-105", name: "4 painéis até 1,05m", time: 0.25, isDefault: false },
                { id: "fundo-4-paineis-maior-105", name: "4 painéis maior que 1,05m", time: 0.25, isDefault: false },
                { id: "fundo-altura-17", name: "Altura maior que 1,7m", time: 0.25, isDefault: false },
                { id: "fundo-liner-abas", name: "Com liner com abas", time: 8.00, isDefault: false }
            ],
            topo: [
                { id: "topo-op-padrao", name: "Topo (Operação padrão)", time: 1.75, isDefault: true },
                { id: "topo-sem-pers", name: "Sem personalização", time: 0.00, isDefault: false },
                { id: "topo-laminado", name: "Laminado", time: 0.35, isDefault: false },
                { id: "topo-dobra-dupla", name: "Dobra dupla", time: 0.00, isDefault: false },
                { id: "topo-forrado", name: "Forrado", time: 0.25, isDefault: false },
                { id: "topo-feltro", name: "Feltro", time: 1.75, isDefault: false },
                { id: "topo-1-vedante", name: "1 Vedante", time: 1.00, isDefault: false },
                { id: "topo-2-vedante", name: "2 Vedante", time: 1.50, isDefault: false },
                { id: "topo-ate-100", name: "Até 1,00m", time: 0.00, isDefault: false },
                { id: "topo-maior-100", name: "Maior que 1,00m", time: 0.25, isDefault: false },
                { id: "topo-4-paineis-105", name: "4 Painéis até 1,05m", time: 0.25, isDefault: false },
                { id: "topo-4-paineis-maior-105", name: "4 Paineis maior que 1,05m", time: 0.25, isDefault: false },
                { id: "topo-altura-17", name: "Altura maior que 1,7m", time: 0.35, isDefault: false },
                { id: "topo-envelope", name: "Envelope", time: 0.35, isDefault: false },
                { id: "topo-saia", name: "Saia", time: -0.50, isDefault: false },
                { id: "topo-liner-abas", name: "Com liner e com abas", time: 8.00, isDefault: false }
            ]
        };

        // Load persisted checklist state or set all to true by default (as in user's image)
        const storageKey = "bigbag-kanban-states-v1";
        let checklistStates = {};

        function loadStates() {
            const stored = localStorage.getItem(storageKey);
            if (stored) {
                try {
                    checklistStates = JSON.parse(stored);
                } catch(e) {
                    checklistStates = {};
                }
            } else {
                // Default is ALL CHECKED to match the spreadsheet sample perfectly
                setAllCheckboxStates(true);
            }
        }

        function saveStates() {
            localStorage.setItem(storageKey, JSON.stringify(checklistStates));
        }

        function setAllCheckboxStates(checkedVal) {
            Object.keys(data).forEach(columnKey => {
                data[columnKey].forEach(item => {
                    checklistStates[item.id] = checkedVal;
                });
            });
        }

        function restoreDefaults() {
            Object.keys(data).forEach(columnKey => {
                data[columnKey].forEach(item => {
                    checklistStates[item.id] = item.isDefault; // true only for standard operations
                });
            });
            saveStates();
            updateUI();
            showToast("Restaurado para as Operações Padrão!");
        }

        // Render Column Option Cards
        function renderColumns() {
            Object.keys(data).forEach(columnKey => {
                const listContainer = document.getElementById(`list-${columnKey}`);
                listContainer.innerHTML = "";

                data[columnKey].forEach(item => {
                    const isChecked = checklistStates[item.id] !== false; // default to true if undefined
                    
                    const label = document.createElement("label");
                    label.className = "option-wrapper";
                    
                    // Format prefix +/-
                    const timeFormatted = item.time >= 0 
                        ? `+${item.time.toFixed(2).replace('.', ',')} min`
                        : `${item.time.toFixed(2).replace('.', ',')} min`;

                    label.innerHTML = `
                        <input type="checkbox" id="${item.id}" class="option-input" ${isChecked ? 'checked' : ''} onchange="toggleOption('${item.id}', '${columnKey}', this.checked)">
                        <div class="option-card">
                            <div class="option-content">
                                <div class="custom-checkbox">
                                    <svg viewBox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                                <span class="option-name">${item.name}</span>
                            </div>
                            <span class="option-badge">${timeFormatted}</span>
                        </div>
                    `;
                    listContainer.appendChild(label);
                });
            });
        }

        // Handle Checkbox Toggles
        window.toggleOption = function(id, columnKey, isChecked) {
            checklistStates[id] = isChecked;
            saveStates();
            calculateTotals(columnKey);
        };

        // Recalculate and update values
        function calculateTotals(targetColumn = null) {
            let grandTotal = 0;
            const columnsToCalculate = targetColumn ? [targetColumn] : Object.keys(data);

            // Compute totals for all columns
            Object.keys(data).forEach(columnKey => {
                let columnTotal = 0;
                let activeCount = 0;

                data[columnKey].forEach(item => {
                    const isChecked = checklistStates[item.id] !== false;
                    if (isChecked) {
                        columnTotal += item.time;
                        activeCount++;
                    }
                });

                grandTotal += columnTotal;

                // Update UI elements for specific columns
                const countBadge = document.getElementById(`count-${columnKey}`);
                const totalDisplay = document.getElementById(`total-${columnKey}`);

                if (countBadge) countBadge.innerText = `${activeCount}/${data[columnKey].length}`;
                if (totalDisplay) {
                    const formatted = columnTotal.toFixed(2).replace('.', ',');
                    
                    // Add subtle glow animation if column updated
                    if (targetColumn === columnKey && totalDisplay.innerText !== `${formatted} min`) {
                        totalDisplay.parentElement.classList.add("pulse-change");
                        setTimeout(() => {
                            totalDisplay.parentElement.classList.remove("pulse-change");
                        }, 400);
                    }
                    totalDisplay.innerText = `${formatted} min`;
                }
            });

            // Update Grand Total Dashboard
            const grandTotalDisplay = document.getElementById("grand-total");
            const grandTotalReadable = document.getElementById("grand-total-readable");
            
            const prevTotal = grandTotalDisplay.innerText;
            const formattedGrandTotal = grandTotal.toFixed(2).replace('.', ',');
            grandTotalDisplay.innerHTML = `${formattedGrandTotal} <span style="font-size: 1.25rem; font-weight: 600; margin-left: 0.1rem;">min</span>`;
            
            // Format readable version (Hours, Minutes, Seconds)
            const minutesAbs = Math.abs(grandTotal);
            const wholeMinutes = Math.floor(minutesAbs);
            const seconds = Math.round((minutesAbs - wholeMinutes) * 60);
            
            let readableString = "";
            if (grandTotal < 0) readableString += "- ";
            
            if (wholeMinutes > 0) {
                readableString += `${wholeMinutes} min`;
            }
            if (seconds > 0 || wholeMinutes === 0) {
                readableString += ` ${seconds} s`;
            }
            grandTotalReadable.innerText = readableString.trim();

            if (prevTotal !== grandTotalDisplay.innerText && targetColumn) {
                grandTotalDisplay.parentElement.classList.add("pulse-change");
                setTimeout(() => {
                    grandTotalDisplay.parentElement.classList.remove("pulse-change");
                }, 400);
            }
        }

        // Master Controls
        document.getElementById("btn-select-all").addEventListener("click", () => {
            setAllCheckboxStates(true);
            saveStates();
            updateUI();
            showToast("Todas as opções foram marcadas!");
        });

        document.getElementById("btn-clear-all").addEventListener("click", () => {
            setAllCheckboxStates(false);
            saveStates();
            updateUI();
            showToast("Todas as opções foram desmarcadas!");
        });

        document.getElementById("btn-restore-defaults").addEventListener("click", () => {
            restoreDefaults();
        });

        // Copy Text Summary
        document.getElementById("btn-copy").addEventListener("click", () => {
            let summaryText = `📋 **RESUMO DO TEMPO DE PRODUÇÃO - BIG BAGS**\n\n`;
            
            let grandTotal = 0;
            
            Object.keys(data).forEach(columnKey => {
                const colTitle = columnKey.charAt(0).toUpperCase() + columnKey.slice(1);
                let colTotal = 0;
                let colItems = [];

                data[columnKey].forEach(item => {
                    const isChecked = checklistStates[item.id] !== false;
                    if (isChecked) {
                        colTotal += item.time;
                        const timeFormatted = item.time >= 0 
                            ? `+${item.time.toFixed(2)}m`
                            : `${item.time.toFixed(2)}m`;
                        colItems.push(`  - [x] ${item.name} (${timeFormatted})`);
                    }
                });

                grandTotal += colTotal;
                
                if (colItems.length > 0) {
                    summaryText += `🔹 **Bloco ${colTitle}** (Total: ${colTotal.toFixed(2).replace('.', ',')} min)\n`;
                    summaryText += colItems.join("\n") + "\n\n";
                } else {
                    summaryText += `🔹 **Bloco ${colTitle}** (Vazio / 0,00 min)\n\n`;
                }
            });

            const minutesAbs = Math.abs(grandTotal);
            const wholeMinutes = Math.floor(minutesAbs);
            const seconds = Math.round((minutesAbs - wholeMinutes) * 60);
            const readableStr = `${wholeMinutes}m ${seconds}s`;

            summaryText += `===================================\n`;
            summaryText += `⏱️ **Tempo Total de Costura:** ${grandTotal.toFixed(2).replace('.', ',')} min (${readableStr})`;

            navigator.clipboard.writeText(summaryText).then(() => {
                showToast("Resumo copiado para a área de transferência!");
            }).catch(err => {
                showToast("Erro ao copiar resumo.");
                console.error("Erro ao copiar: ", err);
            });
        });

        // Toast Helper
        function showToast(message) {
            const toast = document.getElementById("toast-notify");
            const toastMsg = document.getElementById("toast-message");
            toastMsg.innerText = message;
            toast.classList.add("show");
            
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // Full UI Sync
        function updateUI() {
            renderColumns();
            calculateTotals();
        }

        // Initialize App
        loadStates();
        updateUI();
    </script>
</body>
</html>
