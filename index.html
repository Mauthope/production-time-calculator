<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Tempo de Produção - Kanban</title>
    <!-- Google Fonts: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060a13;
            --bg-card: rgba(15, 23, 42, 0.45);
            --bg-input: rgba(10, 16, 30, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Theme Colors for Blocks */
            --color-alca: #06b6d4; /* Cyan */
            --color-alca-glow: rgba(6, 182, 212, 0.12);
            
            --color-fundo: #10b981; /* Emerald */
            --color-fundo-glow: rgba(16, 185, 129, 0.12);
            
            --color-topo: #8b5cf6; /* Violet */
            --color-topo-glow: rgba(139, 92, 246, 0.12);
            
            --color-travas: #f59e0b; /* Amber */
            --color-travas-glow: rgba(245, 158, 11, 0.12);
            
            --color-fechamento: #f43f5e; /* Rose */
            --color-fechamento-glow: rgba(244, 63, 94, 0.12);
            
            --color-valv-fundo: #0d9488; /* Teal */
            --color-valv-fundo-glow: rgba(13, 148, 136, 0.12);
            
            --color-valv-topo: #4f46e5; /* Indigo */
            --color-valv-topo-glow: rgba(79, 70, 229, 0.12);
            
            --color-saia: #d946ef; /* Fuchsia */
            --color-saia-glow: rgba(217, 70, 239, 0.12);
            
            --color-valv-custom: #0ea5e9; /* Sky */
            --color-valv-custom-glow: rgba(14, 165, 233, 0.12);
            
            --color-outras: #64748b; /* Slate */
            --color-outras-glow: rgba(100, 116, 139, 0.12);
            
            --color-preparacao: #84cc16; /* Lime */
            --color-preparacao-glow: rgba(132, 204, 22, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(at 5% 5%, rgba(6, 182, 212, 0.08) 0px, transparent 40%),
                radial-gradient(at 95% 95%, rgba(139, 92, 246, 0.08) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(16, 185, 129, 0.03) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1.5rem 8rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 800px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        .header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            background: linear-gradient(135deg, #06b6d4 10%, #10b981 50%, #8b5cf6 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 400;
        }

        /* Action Menu Bar */
        .actions-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            animation: fadeIn 0.9s ease-out;
        }

        .btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition);
            backdrop-filter: blur(8px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border: none;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0891b2, #0e7490);
            box-shadow: 0 6px 16px rgba(6, 182, 212, 0.35);
        }

        /* Kanban Board Grid (Wrap-around Grid) */
        .board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            animation: slideUpNormal 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Kanban Column / Block */
        .column {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            min-height: 480px;
            transition: var(--transition);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .column:hover {
            box-shadow: 0 12px 36px -8px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Column Header */
        .column-header {
            margin-bottom: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .column-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .item-count {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
            font-weight: 500;
        }

        /* Items Container */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        /* Checkbox Option Card */
        .option-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: transparent;
            transition: var(--transition);
        }

        .option-card:hover {
            transform: translateX(2px);
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Hidden Input Checkbox */
        .option-input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        /* Styled checkbox label content */
        .option-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-grow: 1;
            padding-right: 0.5rem;
        }

        /* Custom Checkbox Indicator */
        .custom-checkbox {
            width: 1.1rem;
            height: 1.1rem;
            border: 1.5px solid var(--text-muted);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            flex-shrink: 0;
            background: transparent;
        }

        .custom-checkbox svg {
            width: 0.65rem;
            height: 0.65rem;
            fill: none;
            stroke: #fff;
            stroke-width: 3.5px;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: scale(0);
            transition: transform 0.15s cubic-bezier(0.12, 0.4, 0.29, 1.46);
        }

        .option-name {
            font-size: 0.875rem;
            font-weight: 500;
            color: #cbd5e1;
            transition: var(--transition);
            line-height: 1.3;
        }

        /* Value Badge */
        .option-badge {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: var(--transition);
            flex-shrink: 0;
            font-family: monospace;
        }

        /* Column Totalizer Card (At bottom) */
        .totalizer-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            transition: var(--transition);
        }

        .totalizer-label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .totalizer-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #fff;
            transition: color 0.3s;
        }

        /* Active CSS bindings for all 11 themes */
        /* ALÇA */
        .column-alca { border-top: 4px solid var(--color-alca); }
        .column-alca .column-title { color: var(--color-alca); }
        .column-alca .totalizer-card { border-color: rgba(6, 182, 212, 0.2); }
        .column-alca .totalizer-value { color: var(--color-alca); }
        .column-alca .option-input:checked + .option-card { background: var(--color-alca-glow); border-color: rgba(6, 182, 212, 0.35); }
        .column-alca .option-input:checked + .option-card::before { background: var(--color-alca); }
        .column-alca .option-input:checked + .option-card .custom-checkbox { background: var(--color-alca); border-color: var(--color-alca); }
        .column-alca .option-input:checked + .option-card .custom-checkbox svg { transform: scale(1); }
        .column-alca .option-input:checked + .option-card .option-name { color: #fff; font-weight: 600; }
        .column-alca .option-input:checked + .option-card .option-badge { background: rgba(6, 182, 212, 0.2); color: var(--color-alca); border-color: rgba(6, 182, 212, 0.1); }

        /* FUNDO */
        .column-fundo { border-top: 4px solid var(--color-fundo); }
        .column-fundo .column-title { color: var(--color-fundo); }
        .column-fundo .totalizer-card { border-color: rgba(16, 185, 129, 0.2); }
        .column-fundo .totalizer-value { color: var(--color-fundo); }
        .column-fundo .option-input:checked + .option-card { background: var(--color-fundo-glow); border-color: rgba(16, 185, 129, 0.35); }
        .column-fundo .option-input:checked + .option-card::before { background: var(--color-fundo); }
        .column-fundo .option-input:checked + .option-card .custom-checkbox { background: var(--color-fundo); border-color: var(--color-fundo); }
        .column-fundo .option-input:checked + .option-card .custom-checkbox svg { transform: scale(1); }
        .column-fundo .option-input:checked + .option-card .option-name { color: #fff; font-weight: 600; }
        .column-fundo .option-input:checked + .option-card .option-badge { background: rgba(16, 185, 129, 0.2); color: var(--color-fundo); border-color: rgba(16, 185, 129, 0.1); }

        /* TOPO */

        .column-topo .option-input:checked + .option-card::before { background: var(--color-topo); }
        .column-topo .option-input:checked + .option-card .custom-checkbox { background: var(--color-topo); border-color: var(--color-topo); }
        .column-topo .option-input:checked + .option-card .custom-checkbox svg { transform: scale(1); }

        .column-topo .option-input:checked + .option-card .option-badge { background: rgba(139, 92, 246, 0.2); color: var(--color-topo); border-color: rgba(139, 92, 246, 0.1); }

        /* TRAVAS */
        .column-travas { border-top: 4px solid var(--color-travas); }
        .column-travas .column-title { color: var(--color-travas); }
        .column-travas .totalizer-card { border-color: rgba(245, 158, 11, 0.2); }
        .column-travas .totalizer-value { color: var(--color-travas); }
        .column-travas .option-input:checked + .option-card { background: var(--color-travas-glow); border-color: rgba(245, 158, 11, 0.35); }

        .column-travas .option-input:checked + .option-card .custom-checkbox svg { transform: scale(1); }

        .column-travas .option-input:checked + .option-card .option-badge { background: rgba(245, 158, 11, 0.2); color: var(--color-travas); border-color: rgba(245, 158, 11, 0.1); }

        /* FECHAMENTO */

        .column-fechamento .column-title { color: var(--color-fechamento); }
        .column-fechamento .totalizer-card { border-color: rgba(244, 63, 94, 0.2); }

        .column-fechamento .option-input:checked + .option-card .custom-checkbox svg { transform: scale(1); }

        .column-fechamento .option-input:checked + .option-card .option-badge { background: rgba(244, 63, 94, 0.2); color: var(--color-fechamento); border-color: rgba(244, 63, 94, 0.1); }

        /* VÁLVULA FUNDO */
        .column-valv-fundo { border-top: 4px solid var(--color-valv-fundo); }
        .column-valv-fundo .column-title { color: var(--color-valv-fundo); }
        .column-valv-fundo .totalizer-card { border-color: rgba(13, 148, 136, 0.2); }

        .column-valv-fundo .option-input:checked + .option-card::before { background: var(--color-valv-fundo); }

        /* VÁLVULA TOPO */

        /* Floating Summary Footer Panel */
        .summary-panel {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 900px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 1.25rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(6, 182, 212, 0.1);
            z-index: 100;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            transition: var(--transition);
        }

        @media (max-width: 640px) {
            .summary-panel {
                flex-direction: column;
                gap: 1.25rem;
                padding: 1.25rem;
                text-align: center;
                bottom: 1rem;
            }
        }

        .summary-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .summary-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .summary-total {
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: baseline;
            gap: 0.25rem;
        }

        .summary-total-readable {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .summary-actions {
            display: flex;
            gap: 0.75rem;
        }

        @media (max-width: 640px) {
            .summary-actions {
                width: 100%;
                justify-content: center;
            }
            .summary-actions .btn {
                flex-grow: 1;
                justify-content: center;
            }
        }

        /* Toast notifications styling */
        .toast {
            position: fixed;
            top: 2rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000;
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, 20px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        
        @keyframes slideUpNormal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulse highlight for changes */
        .pulse-change {
            animation: pulseGlow 0.4s ease-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>

                { id: "preparacao-prensa", name: "Prensa", time: 1.00, isDefault: true },
                { id: "preparacao-velcro-automatica", name: "Velcro máquina automática", time: 0.35, isDefault: false },
                { id: "preparacao-lamina-braskem", name: "Lâmina maq. Automática braskem", time: 0.27, isDefault: false },
                { id: "preparacao-lamina-videolar", name: "Lamina maq automática videolar", time: 0.69, isDefault: false },
                { id: "preparacao-presilha-automatica", name: "Presilha máq automática", time: 0.48, isDefault: false },
                { id: "preparacao-montagem-acessorios", name: "Montagem acessórios", time: 0.47, isDefault: false },
                { id: "preparacao-bolacha-cadarco", name: "Bolacha e cadarço no fundo", time: 0.40, isDefault: false },
                { id: "preparacao-porta-rafia", name: "Porta dcto de Ráfia", time: 1.00, isDefault: false },
                { id: "preparacao-montagem-porta", name: "Montagem de porta de dcto de (pe + Rafia)", time: 0.20, isDefault: false },
                { id: "preparacao-etiqueta-regata", name: "Etiqueta regata (unidade)", time: 0.02, isDefault: true },
                { id: "preparacao-etiquetas", name: "Etiquetas (unidade)", time: 0.01, isDefault: true },
                { id: "preparacao-costura-patch", name: "Costura do patch (Desfiamento - 4 Um)", time: 1.60, isDefault: false }
            ]
        };

        const storageKey = "bigbag-kanban-states-v3";
        let checklistStates = {};

        // Load states from LocalStorage or initialize to ALL CHECKED (matching Excel sheet visuals)
        function loadStates() {
            const stored = localStorage.getItem(storageKey);
            if (stored) {
                try {
                    checklistStates = JSON.parse(stored);
                } catch(e) {
                    checklistStates = {};
                }
            } else {
                setAllCheckboxStates(true);
            }
        }

        function saveStates() {
            localStorage.setItem(storageKey, JSON.stringify(checklistStates));
        }

        function setAllCheckboxStates(checkedVal) {
            Object.keys(data).forEach(columnKey => {
                data[columnKey].forEach(item => {
                    checklistStates[item.id] = checkedVal;
                });
            });
        }

        function restoreDefaults() {
            Object.keys(data).forEach(columnKey => {
                data[columnKey].forEach(item => {
                    checklistStates[item.id] = item.isDefault; // true only for standard operations
                });
            });
            saveStates();
            updateUI();
            showToast("Restaurado para as Operações Padrão!");
        }

        // Dynamically build and render the 11 columns on the board
        function renderBoard() {
            const boardContainer = document.getElementById("board-container");
            boardContainer.innerHTML = "";

            Object.keys(columnsConfig).forEach(columnKey => {
                const config = columnsConfig[columnKey];
                const columnItems = data[columnKey];
                
                const columnSection = document.createElement("section");
                columnSection.className = `column column-${config.colorClass}`;
                columnSection.id = `col-${columnKey}`;
                
                columnSection.innerHTML = `
                    <div class="column-header">
                        <h2 class="column-title">
                            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="${config.icon}"/>
                            </svg>
                            ${config.title}
                        </h2>
                        <span class="item-count" id="count-${columnKey}">0/${columnItems.length}</span>
                    </div>
                    <div class="items-list" id="list-${columnKey}"></div>
                    <div class="totalizer-card">
                        <span class="totalizer-label">Totalizador</span>
                        <span class="totalizer-value" id="total-${columnKey}">0,00 min</span>
                    </div>
                `;
                
                boardContainer.appendChild(columnSection);
                
                const listContainer = columnSection.querySelector(`#list-${columnKey}`);
                
                columnItems.forEach(item => {
                    const isChecked = checklistStates[item.id] !== false;
                    
                    const label = document.createElement("label");
                    label.className = "option-wrapper";
                    
                    const timeFormatted = item.time >= 0 
                        ? `+${item.time.toFixed(2).replace('.', ',')} min`
                        : `${item.time.toFixed(2).replace('.', ',')} min`;

                    label.innerHTML = `
                        <input type="checkbox" id="${item.id}" class="option-input" ${isChecked ? 'checked' : ''} onchange="toggleOption('${item.id}', '${columnKey}', this.checked)">
                        <div class="option-card">
                            <div class="option-content">
                                <div class="custom-checkbox">
                                    <svg viewBox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                </div>
                                <span class="option-name">${item.name}</span>
                            </div>
                            <span class="option-badge">${timeFormatted}</span>
                        </div>
                    `;
                    listContainer.appendChild(label);
                });
            });
        }

        // Handle Checkbox Toggles
        window.toggleOption = function(id, columnKey, isChecked) {
            checklistStates[id] = isChecked;
            saveStates();
            calculateTotals(columnKey);
        };

        // Recalculate totals
        function calculateTotals(targetColumn = null) {
            let grandTotal = 0;

            Object.keys(data).forEach(columnKey => {
                let columnTotal = 0;
                let activeCount = 0;

                data[columnKey].forEach(item => {
                    const isChecked = checklistStates[item.id] !== false;
                    if (isChecked) {
                        columnTotal += item.time;
                        activeCount++;
                    }
                });

                grandTotal += columnTotal;

                // Update UI elements for specific columns
                const countBadge = document.getElementById(`count-${columnKey}`);
                const totalDisplay = document.getElementById(`total-${columnKey}`);

                if (countBadge) countBadge.innerText = `${activeCount}/${data[columnKey].length}`;
                if (totalDisplay) {
                    const formatted = columnTotal.toFixed(2).replace('.', ',');
                    
                    // Add subtle glow animation if column updated
                    if (targetColumn === columnKey && totalDisplay.innerText !== `${formatted} min`) {
                        totalDisplay.parentElement.classList.add("pulse-change");
                        setTimeout(() => {
                            totalDisplay.parentElement.classList.remove("pulse-change");
                        }, 400);
                    }
                    totalDisplay.innerText = `${formatted} min`;
                }
            });

            // Update Grand Total Dashboard
            const grandTotalDisplay = document.getElementById("grand-total");
            const grandTotalReadable = document.getElementById("grand-total-readable");
            
            const prevTotal = grandTotalDisplay.innerText;
            const formattedGrandTotal = grandTotal.toFixed(2).replace('.', ',');
            grandTotalDisplay.innerHTML = `${formattedGrandTotal} <span style="font-size: 1.25rem; font-weight: 600; margin-left: 0.1rem;">min</span>`;
            
            // Format readable version (Hours, Minutes, Seconds)
            const minutesAbs = Math.abs(grandTotal);
            const wholeMinutes = Math.floor(minutesAbs);
            const seconds = Math.round((minutesAbs - wholeMinutes) * 60);
            
            let readableString = "";
            if (grandTotal < 0) readableString += "- ";
            
            if (wholeMinutes > 0) {
                readableString += `${wholeMinutes} min`;
            }
            if (seconds > 0 || wholeMinutes === 0) {
                readableString += ` ${seconds} s`;
            }
            grandTotalReadable.innerText = readableString.trim();

            if (prevTotal !== grandTotalDisplay.innerText && targetColumn) {
                grandTotalDisplay.parentElement.classList.add("pulse-change");
                setTimeout(() => {
                    grandTotalDisplay.parentElement.classList.remove("pulse-change");
                }, 400);
            }
        }

        // Master Controls
        document.getElementById("btn-select-all").addEventListener("click", () => {
            setAllCheckboxStates(true);
            saveStates();
            updateUI();
            showToast("Todas as opções foram marcadas!");
        });

        document.getElementById("btn-clear-all").addEventListener("click", () => {
            setAllCheckboxStates(false);
            saveStates();
            updateUI();
            showToast("Todas as opções foram desmarcadas!");
        });

        document.getElementById("btn-restore-defaults").addEventListener("click", () => {
            restoreDefaults();
        });

        // Copy Text Summary
        document.getElementById("btn-copy").addEventListener("click", () => {
            let summaryText = `📋 **RESUMO DO TEMPO DE PRODUÇÃO - BIG BAGS**\n\n`;
            let grandTotal = 0;
            
            Object.keys(data).forEach(columnKey => {
                const colTitle = columnsConfig[columnKey].title;
                let colTotal = 0;
                let colItems = [];

                data[columnKey].forEach(item => {
                    const isChecked = checklistStates[item.id] !== false;
                    if (isChecked) {
                        colTotal += item.time;
                        const timeFormatted = item.time >= 0 
                            ? `+${item.time.toFixed(2)}m`
                            : `${item.time.toFixed(2)}m`;
                        colItems.push(`  - [x] ${item.name} (${timeFormatted})`);
                    }
                });

                grandTotal += colTotal;
                
                if (colItems.length > 0) {
                    summaryText += `🔹 **${colTitle}** (Total: ${colTotal.toFixed(2).replace('.', ',')} min)\n`;
                    summaryText += colItems.join("\n") + "\n\n";
                } else {
                    summaryText += `🔹 **${colTitle}** (Vazio / 0,00 min)\n\n`;
                }
            });

            const minutesAbs = Math.abs(grandTotal);
            const wholeMinutes = Math.floor(minutesAbs);
            const seconds = Math.round((minutesAbs - wholeMinutes) * 60);
            const readableStr = `${wholeMinutes}m ${seconds}s`;

            summaryText += `===================================\n`;
            summaryText += `⏱️ **Tempo Total de Costura:** ${grandTotal.toFixed(2).replace('.', ',')} min (${readableStr})`;

            navigator.clipboard.writeText(summaryText).then(() => {
                showToast("Resumo copiado para a área de transferência!");
            }).catch(err => {
                showToast("Erro ao copiar resumo.");
                console.error("Erro ao copiar: ", err);
            });
        });

        // Toast Helper
        function showToast(message) {
            const toast = document.getElementById("toast-notify");
            const toastMsg = document.getElementById("toast-message");
            toastMsg.innerText = message;
            toast.classList.add("show");
            
            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        // Full UI Sync
        function updateUI() {
            renderBoard();
            calculateTotals();
        }

        // Initialize App
        loadStates();
        updateUI();
    </script>
</body>
</html>
